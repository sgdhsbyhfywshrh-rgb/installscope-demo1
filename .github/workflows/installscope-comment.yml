name: installscope-comment
on:
  workflow_run:
    workflows: ["installscope"]
    types: [completed]
permissions:
  pull-requests: write
  contents: read
  actions: read
jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installscope-report
          path: installscope-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          pr_number="$(tr -d '[:space:]' < installscope-artifact/pr.txt)"
          printf '%s\n' "<!-- installscope-report -->" > comment-body.md
          cat installscope-artifact/installscope-comment.md >> comment-body.md
          printf '\n<sub>Full evidence: %s/%s/actions/runs/%s</sub>\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RUN_ID" >> comment-body.md
          existing="\( (gh api "repos/ \){GITHUB_REPOSITORY}/issues/${pr_number}/comments" --paginate \
            | jq -r --arg marker "<!-- installscope-report -->" \
              '.[] | select(.body | startswith($marker)) | .id' | head -n 1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/\( {GITHUB_REPOSITORY}/issues/comments/ \){existing}" \
              -F body=@comment-body.md > /dev/null
          else
            gh api --method POST "repos/\( {GITHUB_REPOSITORY}/issues/ \){pr_number}/comments" \
              -F body=@comment-body.md > /dev/null
          fi
